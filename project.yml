name: NeuproPatchTracker
options:
  bundleIdPrefix: com.neupro.tracker
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NeuproPatchTracker:
    type: application
    platform: iOS
    sources:
      - path: NeuproPatchTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neupro.tracker.NeuproPatchTracker
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Neupro Tracker"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
  NeuproPatchTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeuproPatchTrackerTests
    dependencies:
      - target: NeuproPatchTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neupro.tracker.NeuproPatchTrackerTests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  NeuproPatchTracker:
    build:
      targets:
        NeuproPatchTracker: all
        NeuproPatchTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeuproPatchTrackerTests
